name: Nigeria History Today

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script name under src/cli/ (without .ts) to run"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        run: npm ci

      - name: Run script
        run: doppler run -- npx ts-node --project tsconfig.json src/cli/${{ inputs.script }}.ts
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
